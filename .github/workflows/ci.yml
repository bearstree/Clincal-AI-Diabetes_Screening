name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest
      - name: Validate notebooks
        run: python -c "from pathlib import Path; import nbformat; [nbformat.read(p, as_version=4) for p in Path('.').glob('*.ipynb')]; [nbformat.read(p, as_version=4) for p in Path('notebooks').glob('*.ipynb')]"
      - name: Verify model and build Space bundle
        run: |
          python -c "import hashlib,json,pathlib; p=pathlib.Path('deployment/model'); m=json.loads((p/'manifest.json').read_text()); assert hashlib.sha256((p/m['artifact']).read_bytes()).hexdigest()==m['artifact_sha256']"
          python scripts/build_hf_space.py
      - name: Check web JavaScript
        run: node --check web/app.js
      - name: Build container
        run: docker build -f deployment/api/Dockerfile -t clinical-ai-ci .
