name: Deploy Hugging Face Space

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: huggingface-production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"
      - run: python -m pip install huggingface-hub==1.24.0
      - run: python scripts/build_hf_space.py
      - run: python scripts/publish_hf_space.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
          HF_COMMIT_MESSAGE: Deploy ${{ github.sha }}
