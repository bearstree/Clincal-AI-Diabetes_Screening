name: release-model

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"
      - name: Verify artifact checksum
        run: python -c "import hashlib,json,pathlib; p=pathlib.Path('deployment/model'); m=json.loads((p/'manifest.json').read_text()); assert hashlib.sha256((p/m['artifact']).read_bytes()).hexdigest()==m['artifact_sha256']"
      - uses: actions/attest@v4
        with:
          subject-path: deployment/model/clinical_diabetes_screening_v1.joblib
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            deployment/model/clinical_diabetes_screening_v1.joblib
            deployment/model/manifest.json
