[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-ai-portfolio"
version = "0.1.0"
description = "Educational end-to-end clinical AI portfolio project"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
  "fastapi==0.141.1",
  "joblib==1.5.3",
  "matplotlib==3.11.1",
  "pandas==3.0.5",
  "scikit-learn==1.9.0",
  "uvicorn==0.52.1",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.9.1",
  "mypy==2.3.0",
  "nbformat==5.11.0",
  "pre-commit==4.6.1",
  "pytest==9.1.1",
  "ruff==0.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["clinical_ml"]

[[tool.mypy.overrides]]
module = ["joblib", "pandas", "pandas.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true
